replicaCount: 1   # the app keeps todos in memory, so run a single replica

image:
  repository: 216016752342.dkr.ecr.ap-south-1.amazonaws.com/todo-api
  tag: "8f002bbe"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP   # reach it with kubectl port-forward; set LoadBalancer later if you want public access
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
